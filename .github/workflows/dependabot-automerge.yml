name: Dependabot auto-merge

# Runs the tests on every Dependabot pull request. If they pass, minor and patch
# updates are merged; major updates get a comment and wait for a person to review.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.14"]   # oldest and newest supported
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run offline tests (fail on deprecation warnings from pandas)
        run: python -W error::FutureWarning -m unittest discover -v -p "test_*.py"

  merge:
    needs: test
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the update details
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge minor and patch updates
        # only when Dependabot reports a minor or patch update; grouped updates that mix
        # versions report no single type and wait for review like major ones
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "$PR_URL"

      - name: Ask for review of major updates
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-minor' &&
          steps.meta.outputs.update-type != 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr comment "$PR_URL" --body "This update (${DEPS}) is a major version, or a group whose version change could not be classified. The tests passed, but such updates can change behaviour, so it was not merged automatically. Check the release notes, then merge it by hand."
