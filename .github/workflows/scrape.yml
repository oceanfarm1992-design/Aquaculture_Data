name: Scrape data

# Builds every table with run_all.py, then keeps it three ways:
#   1. a GitHub Release per run (permanent archive of every table, CSV + JSON, zipped)
#   2. a workflow artifact (90 days)
#   3. Supabase, if SUPABASE_URL and the SUPABASE_SERVICE_ROLE_KEY secret are set
#      (rows are upserted and never deleted; see README)
# The data sources need no API keys.
# Optional: set a repository variable SCRAPER_CONTACT
# (Settings > Secrets and variables > Actions > Variables) to an email or URL that
# data owners can use to reach you; it is sent in the User-Agent.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      tables:
        description: "Tables to build, space separated (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # to publish the run's data as a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build tables
        env:
          AQUA_SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
          TABLES: ${{ inputs.tables }}
        run: |
          if [ -n "$TABLES" ]; then
            python run_all.py --out-dir data --only $TABLES
          else
            python run_all.py --out-dir data
          fi

      - name: Check Supabase settings
        id: supabase
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase not configured (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY); skipping the database load."
          fi

      - name: Load into Supabase
        if: ${{ !cancelled() && steps.supabase.outputs.configured == 'true' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python load_to_supabase.py --data-dir data

      - name: Summarise output
        if: always()
        shell: python
        run: |
          import os, pathlib
          import pandas as pd
          files = sorted(pathlib.Path("data").glob("*.csv"))
          lines = ["## Scraped tables", "", "| File | Rows | Columns |", "|---|---|---|"]
          for f in files:
              df = pd.read_csv(f, low_memory=False)
              lines.append(f"| `{f.name}` | {len(df)} | {df.shape[1]} |")
          if not files:
              lines.append("| (no files written) | | |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")

      - name: Archive this run as a GitHub Release
        if: ${{ !cancelled() && hashFiles('data/*.csv') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tag="data-${stamp}-run${RUN_NUMBER}"
          zipfile="aquaculture-data-${stamp}-run${RUN_NUMBER}.zip"
          (cd data && zip -q -9 "../${zipfile}" ./*.csv ./*.json)
          {
            echo "Every table scraped by run #${RUN_NUMBER} on ${stamp}, as CSV and JSON."
            echo
            echo "Row counts and logs: ${RUN_URL}"
            echo
            echo "Each row records where it came from (source_url, record_url, reference_url)."
          } > notes.md
          gh release create "$tag" "$zipfile" --target "$GITHUB_SHA" \
            --title "Data snapshot ${stamp} (run ${RUN_NUMBER})" --notes-file notes.md --latest=false
          echo "Archived as release ${tag}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquaculture-data-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 90
