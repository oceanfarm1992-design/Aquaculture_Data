name: Scrape data

# Builds the tables with run_all.py, then keeps each piece of data once:
#   - Supabase (if the SUPABASE_URL and SUPABASE_SECRET_KEY secrets are set): only
#     new or changed rows are written; nothing is deleted
#   - GitHub Releases (weekly runs, and daily runs when Supabase is not set up): only
#     tables whose content changed since the last archive are stored, as CSV; a
#     manifest.json in each release says which release holds every table
#   - a 7-day artifact only when the run's data was not saved either way
# The data sources need no API keys.
# Optional: set a repository variable SCRAPER_CONTACT
# (Settings > Secrets and variables > Actions > Variables) to an email or URL that
# data owners can use to reach you; it is sent in the User-Agent.

on:
  schedule:
    - cron: "17 3 * * 1"          # Mondays 03:17 UTC: every table, archived as a release
    - cron: "43 5 * * 0,2-6"      # Other days 05:43 UTC: news and research only
    - cron: "29 2 1 * *"          # 1st of each month 02:29 UTC: species data (taxonomy, biology, ...)
  workflow_dispatch:
    inputs:
      tables:
        description: "Tables to build, space separated; 'species' for all species tables (empty = weekly tables)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # to publish the run's data as a GitHub Release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build tables
        env:
          AQUA_SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
          TABLES: ${{ inputs.tables }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "43 5 * * 0,2-6" ]; then
            TABLES="news_articles research_publications"
          fi
          if [ "$SCHEDULE" = "29 2 1 * *" ] || [ "$TABLES" = "species" ]; then
            python run_all.py --out-dir data --group species
          elif [ -n "$TABLES" ]; then
            python run_all.py --out-dir data --only $TABLES
          else
            python run_all.py --out-dir data
          fi

      - name: Check Supabase settings
        id: supabase
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          # the new sb_secret_... key, or the legacy service_role key
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase not configured (needs secrets SUPABASE_URL and SUPABASE_SECRET_KEY); skipping the database load."
          fi

      - name: Load into Supabase
        id: load
        if: ${{ !cancelled() && steps.supabase.outputs.configured == 'true' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          # the new sb_secret_... key, or the legacy service_role key
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python load_to_supabase.py --data-dir data

      - name: Summarise output
        if: always()
        shell: python
        run: |
          import os, pathlib
          import pandas as pd
          files = sorted(pathlib.Path("data").glob("*.csv"))
          lines = ["## Scraped tables", "", "| File | Rows | Columns |", "|---|---|---|"]
          for f in files:
              df = pd.read_csv(f, low_memory=False)
              lines.append(f"| `{f.name}` | {len(df)} | {df.shape[1]} |")
          if not files:
              lines.append("| (no files written) | | |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")

      - name: Archive changed tables as a GitHub Release
        id: archive
        # weekly full runs; daily runs too when there is no database to keep them
        if: >-
          ${{ !cancelled() && hashFiles('data/*.json') != '' &&
              ((github.event.schedule != '43 5 * * 0,2-6' && inputs.tables == '') ||
               steps.supabase.outputs.configured != 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          tag="data-${stamp}-run${RUN_NUMBER}"
          # manifest of the most recent archive, to compare against
          prev=$(gh release list --limit 100 --json tagName,publishedAt \
                   --jq '[.[] | select(.tagName | startswith("data-"))] | sort_by(.publishedAt) | last | .tagName // empty')
          rm -f previous_manifest.json
          if [ -n "$prev" ]; then
            gh release download "$prev" --pattern manifest.json --output previous_manifest.json \
              || echo "Release $prev has no manifest.json; every table counts as new this time."
          fi
          python archive.py --data-dir data --previous previous_manifest.json --tag "$tag" --run-url "$RUN_URL"
          if [ ! -s changed.txt ]; then
            echo "Nothing changed since ${prev}; no release made (nothing is stored twice)." >> "$GITHUB_STEP_SUMMARY"
            echo "archived=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zipfile="aquaculture-data-${stamp}-run${RUN_NUMBER}.zip"
          (cd data && zip -q -9 "../${zipfile}" $(sed 's/$/.csv/' ../changed.txt))
          gh release create "$tag" "$zipfile" manifest.json --target "$GITHUB_SHA" \
            --title "Data snapshot ${stamp} (run ${RUN_NUMBER})" --notes-file notes.md --latest=false
          {
            echo "Archived $(wc -l < changed.txt) changed table(s) as release ${tag}:"
            sed 's/^/- /' changed.txt
          } >> "$GITHUB_STEP_SUMMARY"
          echo "archived=true" >> "$GITHUB_OUTPUT"

      - name: Upload data (only if it was not saved anywhere else)
        if: >-
          ${{ always() && steps.archive.outputs.archived != 'true' &&
              steps.archive.outputs.archived != 'unchanged' &&
              (steps.supabase.outputs.configured != 'true' || steps.load.outcome != 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: aquaculture-data-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 7
