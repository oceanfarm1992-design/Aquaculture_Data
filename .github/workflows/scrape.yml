name: Scrape data

# Builds every table with run_all.py and saves them as a downloadable artifact.
# No API keys are needed. Optional: set a repository variable SCRAPER_CONTACT
# (Settings > Secrets and variables > Actions > Variables) to an email or URL that
# data owners can use to reach you; it is sent in the User-Agent.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      tables:
        description: "Tables to build, space separated (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build tables
        env:
          AQUA_SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
          TABLES: ${{ inputs.tables }}
        run: |
          if [ -n "$TABLES" ]; then
            python run_all.py --out-dir data --only $TABLES
          else
            python run_all.py --out-dir data
          fi

      - name: Summarise output
        if: always()
        shell: python
        run: |
          import os, pathlib
          import pandas as pd
          files = sorted(pathlib.Path("data").glob("*.csv"))
          lines = ["## Scraped tables", "", "| File | Rows | Columns |", "|---|---|---|"]
          for f in files:
              df = pd.read_csv(f)
              lines.append(f"| `{f.name}` | {len(df)} | {df.shape[1]} |")
          if not files:
              lines.append("| (no files written) | | |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")

      - name: Upload data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aquaculture-data-${{ github.run_number }}
          path: data/
          if-no-files-found: warn
          retention-days: 90
